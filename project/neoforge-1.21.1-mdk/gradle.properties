mod_description=ImmortalStorage (仙藏) is a cultivation progression, personal storage, automation, and UUID-bound realm mod. Awaken through the Ancient Jade handbook, advance across ten stages, build expandable Kongqiao and Xianqiao storage, automate items, fluids, energy, chemicals, Mana, Source, and Souls, operate the Immortal Furnace, Source Veins, World Shard Miner, Treasure Basin, and Xianqiao Interface, cultivate Nurturing Crystals, master Spirit equipment and the Immortal-Ruin-Forged Spirit Sword, use Substitute Puppets, construct configurable Miniature Immortal Ruins, and face late-game tribulations. Version 0.0.3 bundles Patchouli and supports optional JEI, EMI, AE2, Refined Storage, Mekanism, Botania, Ars Nouveau, Flux Networks, Industrial Foregoing Souls, Create, and Building Gadgets integrations.
